apiVersion: v2
name: opengovmail-certificates
description: |
  Helm chart that renders cert-manager Certificate resources for the OpenGovMail
  / OpenGovMail stack. Each configured domain gets a Certificate (covering
  `domain` and `*.domain`) issued by a cluster-scoped ClusterIssuer.

  This chart does NOT install cert-manager or create the ClusterIssuer — those
  are one-time cluster bootstrap (see scripts/cert-manager-bootstrap.sh).
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - cert-manager
  - letsencrypt
  - tls
  - certificates
  - opengovmail
maintainers:
  - name: OpenGovMail
    url: https://github.com/OpenGovMail
sources:
  - https://github.com/OpenGovMail/opengovmail/pull/325
