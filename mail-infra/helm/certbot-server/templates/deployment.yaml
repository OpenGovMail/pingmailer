apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "certbot-server.fullname" . }}
  labels:
    {{- include "certbot-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "certbot-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "certbot-server.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "certbot-server.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: certbot-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          env:
            - name: CERTBOT_DOMAIN
              value: {{ required "letsencrypt.domain is required (supply via --set letsencrypt.domain=...)" .Values.letsencrypt.domain | quote }}
            {{- if .Values.letsencrypt.additionalDomains }}
            - name: CERTBOT_ADDITIONAL_DOMAINS
              value: {{ .Values.letsencrypt.additionalDomains | quote }}
            {{- end }}
            - name: CERTBOT_EMAIL
              value: {{ required "letsencrypt.email is required (supply via --set letsencrypt.email=...)" .Values.letsencrypt.email | quote }}
            - name: CERTBOT_STAGING
              value: {{ .Values.letsencrypt.staging | quote }}
            - name: CERTBOT_AGREE_TOS
              value: {{ .Values.letsencrypt.agreeTos | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.existingSecret (eq (include "certbot-server.shouldCreateSecret" .) "true") }}
          envFrom:
            - secretRef:
                name: {{ include "certbot-server.secretName" . }}
          {{- end }}
          volumeMounts:
            - name: etc-letsencrypt
              mountPath: /etc/letsencrypt
            - name: var-log-letsencrypt
              mountPath: /var/log/letsencrypt
            - name: var-lib-letsencrypt
              mountPath: /var/lib/letsencrypt
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: etc-letsencrypt
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "certbot-server.fullname" . }}-etc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: var-log-letsencrypt
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "certbot-server.fullname" . }}-log
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: var-lib-letsencrypt
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "certbot-server.fullname" . }}-lib
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
