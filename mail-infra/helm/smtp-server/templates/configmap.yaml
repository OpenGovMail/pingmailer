{{- if not .Values.domain }}
{{- fail "domain is required — pass via -f my-values.yaml or --set domain=example.com" }}
{{- end }}
{{- if and .Values.postfix.submission.enabled (not .Values.tlsSecret.name) }}
{{- fail "tlsSecret.name is required when postfix.submission.enabled=true (submission/587 enforces STARTTLS). Point this at a cert-manager Secret produced by the silver-certificates chart." }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "silver-smtp.fullname" . }}-conf
  labels:
    {{- include "silver-smtp.labels" . | nindent 4 }}
data:
  silver.yaml: |
    domains:
      - domain: {{ .Values.domain }}

  main.cf: |
    # ===========================================================
    # main.cf — rendered by the silver-smtp Helm chart
    # ===========================================================

    # --- Identity ---
    myhostname = {{ include "silver-smtp.hostname" . }}
    mydomain = {{ .Values.domain }}
    myorigin = $mydomain
    mydestination = localhost.localdomain, localhost
    mynetworks = {{ join " " .Values.postfix.myNetworks }}
    inet_interfaces = all
    inet_protocols = ipv4

    # --- Logging ---
    maillog_file = {{ .Values.postfix.maillogFile }}

    # --- TLS ---
    smtpd_tls_cert_file = /etc/letsencrypt/live/{{ .Values.domain }}/fullchain.pem
    smtpd_tls_key_file  = /etc/letsencrypt/live/{{ .Values.domain }}/privkey.pem
    smtpd_tls_CAfile    = /etc/ssl/certs/ca-certificates.crt
    smtpd_tls_security_level   = {{ .Values.postfix.tls.securityLevel }}
    smtpd_tls_protocols        = {{ .Values.postfix.tls.protocols }}
    smtpd_tls_mandatory_protocols = {{ .Values.postfix.tls.mandatoryProtocols }}
    smtpd_tls_ciphers          = {{ .Values.postfix.tls.ciphers }}
    smtpd_tls_mandatory_ciphers = {{ .Values.postfix.tls.mandatoryCiphers }}
    smtpd_tls_exclude_ciphers  = {{ .Values.postfix.tls.excludeCiphers }}
    smtpd_tls_loglevel = 1
    smtpd_tls_received_header = yes

    # --- SASL ---
    smtpd_sasl_type = {{ .Values.postfix.sasl.type }}
    smtpd_sasl_path = {{ .Values.postfix.sasl.path }}
    smtpd_sasl_auth_enable = yes
    broken_sasl_auth_clients = yes
    smtpd_sasl_security_options = noanonymous

    # --- Milters ---
    smtpd_milters     = {{ join " " .Values.postfix.milters }}
    non_smtpd_milters = {{ join " " .Values.postfix.milters }}
    milter_protocol = {{ .Values.postfix.milterProtocol }}
    milter_default_action = {{ .Values.postfix.milterDefaultAction }}

    # --- Restrictions ---
    smtpd_relay_restrictions =
      permit_mynetworks
      permit_sasl_authenticated
      defer_unauth_destination

    smtpd_recipient_restrictions =
      permit_sasl_authenticated
      {{- if .Values.postfix.recipientAccess.rejectAtDomain }}
      check_recipient_access hash:/etc/postfix/recipient_access
      {{- end }}
      reject

    # --- Rate limits ---
    smtpd_client_connection_rate_limit = {{ .Values.postfix.rateLimits.connectionPerClient }}
    smtpd_client_message_rate_limit    = {{ .Values.postfix.rateLimits.messagePerClient }}
    smtpd_client_recipient_rate_limit  = {{ .Values.postfix.rateLimits.recipientPerClient }}
    smtpd_client_connection_count_limit = {{ .Values.postfix.rateLimits.connectionCount }}

    {{- range .Values.postfix.extraMainCf }}
    {{ . }}
    {{- end }}

  master.cf: |
    # ===========================================================
    # master.cf — rendered by the silver-smtp Helm chart
    #
    # chroot column is "n" for every service (chroot is redundant in a container
    # and needs CAP_SYS_CHROOT). The smtp/submission listeners use HIGH ports
    # ({{ .Values.postfix.listen.smtpPort }}/{{ .Values.postfix.listen.submissionPort }}) because the patched-Postfix image runs as a
    # non-root UID and cannot bind <1024; the Service remaps 25/587 -> these.
    # ===========================================================
    {{ .Values.postfix.listen.smtpPort }}      inet  n       -       n       -       -       smtpd
    pickup    unix  n       -       n       60      1       pickup
    cleanup   unix  n       -       n       -       0       cleanup
    qmgr      unix  n       -       n       300     1       qmgr
    tlsmgr    unix  -       -       n       1000?   1       tlsmgr
    rewrite   unix  -       -       n       -       -       trivial-rewrite
    bounce    unix  -       -       n       -       0       bounce
    defer     unix  -       -       n       -       0       bounce
    trace     unix  -       -       n       -       0       bounce
    verify    unix  -       -       n       -       1       verify
    flush     unix  n       -       n       1000?   0       flush
    proxymap  unix  -       -       n       -       -       proxymap
    proxywrite unix -       -       n       -       1       proxymap
    smtp      unix  -       -       n       -       -       smtp
    relay     unix  -       -       n       -       -       smtp
    showq     unix  n       -       n       -       -       showq
    error     unix  -       -       n       -       -       error
    retry     unix  -       -       n       -       -       error
    discard   unix  -       -       n       -       -       discard
    local     unix  -       n       n       -       -       local
    virtual   unix  -       n       n       -       -       virtual
    lmtp      unix  -       -       n       -       -       lmtp
    anvil     unix  -       -       n       -       1       anvil
    scache    unix  -       -       n       -       1       scache
    postlog   unix-dgram n  -       n       -       1       postlogd
    {{- if .Values.postfix.submission.enabled }}

    {{ .Values.postfix.listen.submissionPort }} inet n       -       n       -       -       smtpd
      -o syslog_name=postfix/submission
      -o smtpd_tls_security_level=encrypt
      -o smtpd_sasl_auth_enable=yes
      -o smtpd_tls_auth_only=yes
      -o smtpd_relay_restrictions=permit_sasl_authenticated,reject
      -o smtpd_milters={{ join "," .Values.postfix.submissionMilters }}
    {{- end }}

  recipient_access: |
    # Recipient access table — Helm-rendered.
    # `postmap` runs in the init container to compile this into recipient_access.db.
    {{- if .Values.postfix.recipientAccess.rejectAtDomain }}
    @{{ .Values.domain }}  REJECT This email address does not accept incoming messages
    {{- end }}
