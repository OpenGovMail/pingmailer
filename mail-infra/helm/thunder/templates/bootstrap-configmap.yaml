apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "silver-thunder.bootstrapConfigMapName" . }}
  labels:
    {{- include "silver-thunder.labels" . | nindent 4 }}
  annotations:
    # The subchart's setup-job is a pre-install hook at weight -5. This
    # ConfigMap must exist BEFORE the Job tries to mount it, so we ride
    # the same hook track at weight -10 (matches the upstream's own
    # bootstrap-configmap and setup-config-map).
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation"
data:
{{ (.Files.Glob "files/*.sh").AsConfig | indent 2 }}
