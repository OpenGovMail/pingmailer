{{- if not .Values.config.domain }}
{{- fail "config.domain is required — pass via -f my-values.yaml or --set config.domain=mail.example.com" }}
{{- end }}
{{- if not .Values.config.oauth.audience }}
{{- fail "config.oauth.audience is required — pass at least one OAuth client ID via -f or --set 'config.oauth.audience[0]=client-id'" }}
{{- end }}
{{- if not .Values.oauthEmailAuthorization }}
{{- fail "oauthEmailAuthorization is required — supply the OAuth client_id → email allowlist via -f my-values.yaml (do not commit)" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pingmailer-raven-sasl.fullname" . }}-conf
  labels:
    {{- include "pingmailer-raven-sasl.labels" . | nindent 4 }}
data:
  raven.yaml: |
    domain: {{ .Values.config.domain }}
    auth_server_url: {{ .Values.config.authServerUrl }}

    sasl_scope: {{ .Values.config.saslScope | quote }}

    # OAUTHBEARER Token Validation (RFC 7628)
    oauth_issuer_url: {{ include "pingmailer-raven-sasl.issuerUrl" . | quote }}
    oauth_jwks_url: {{ include "pingmailer-raven-sasl.jwksUrl" . | quote }}
    oauth_audience:
      {{- range .Values.config.oauth.audience }}
      - {{ . | quote }}
      {{- end }}
    oauth_clock_skew_seconds: {{ .Values.config.oauth.clockSkewSeconds }}
    oauth_client_email_authorization_file: "/app/config/oauth_client_email_authorization.json"

  oauth_client_email_authorization.json: |
    {{- toJson .Values.oauthEmailAuthorization | nindent 4 }}
