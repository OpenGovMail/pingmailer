apiVersion: v2
name: smtp-server
description: |
  Helm chart for the Postfix-based SMTP server (ghcr.io/opengovmail/opengovmail-smtp)
  used by the OpenGovMail stack. Renders main.cf / master.cf /
  recipient_access from values, wires Postfix to opendkim-server,
  raven-sasl, and (optionally) rspamd-server, mounts TLS certs from a
  cert-manager Secret, and persists the mail queue on a PVC.
type: application
version: 0.1.0
appVersion: "main"
keywords:
  - postfix
  - smtp
  - email
  - opengovmail
maintainers:
  - name: OpenGovMail
    url: https://github.com/OpenGovMail
sources:
  - https://github.com/OpenGovMail/opengovmail
