{{- if and .Values.pdb.enabled (gt (int .Values.replicaCount) 1) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opengovmail-api-server.fullname" . }}
  labels:
    {{- include "opengovmail-api-server.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "opengovmail-api-server.selectorLabels" . | nindent 6 }}
{{- end }}
