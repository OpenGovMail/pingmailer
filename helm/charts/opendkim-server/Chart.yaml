apiVersion: v2
name: opendkim-server
description: |
  Helm chart for the OpenDKIM milter (ghcr.io/opengovmail/pingmailer-dkim) used by the
  PingMailer stack. Generates per-domain DKIM signing keys on
  first start, persists them in a PVC, and exposes the Milter socket on
  :8891 for Postfix to consume.
type: application
version: 0.1.0
appVersion: "main"
keywords:
  - opendkim
  - dkim
  - milter
  - email
  - pingmailer
maintainers:
  - name: OpenGovMail
    url: https://github.com/OpenGovMail
sources:
  - https://github.com/OpenGovMail/pingmailer
