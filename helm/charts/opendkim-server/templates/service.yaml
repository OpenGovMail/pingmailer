apiVersion: v1
kind: Service
metadata:
  name: {{ include "pingmailer-opendkim.fullname" . }}
  labels:
    {{- include "pingmailer-opendkim.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: milter
      protocol: TCP
      name: milter
  selector:
    {{- include "pingmailer-opendkim.selectorLabels" . | nindent 4 }}
