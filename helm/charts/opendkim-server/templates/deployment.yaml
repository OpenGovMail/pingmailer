apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "silver-opendkim.fullname" . }}
  labels:
    {{- include "silver-opendkim.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate            # PVC is RWO and DKIM is singleton — avoid rolling.
  selector:
    matchLabels:
      {{- include "silver-opendkim.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "silver-opendkim.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the ConfigMap (and therefore opendkim.conf /
        # KeyTable / SigningTable / TrustedHosts / silver.yaml) changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "silver-opendkim.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: opendkim
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: milter
              containerPort: 8891
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/opendkim/opendkim.conf
              subPath: opendkim.conf
              readOnly: true
            - name: config
              mountPath: /etc/opendkim/KeyTable
              subPath: KeyTable
              readOnly: true
            - name: config
              mountPath: /etc/opendkim/SigningTable
              subPath: SigningTable
              readOnly: true
            - name: config
              mountPath: /etc/opendkim/TrustedHosts
              subPath: TrustedHosts
              readOnly: true
            - name: config
              mountPath: /etc/opendkim/silver.yaml
              subPath: silver.yaml
              readOnly: true
            - name: keys
              mountPath: /etc/dkimkeys
            - name: run
              mountPath: /var/run/opendkim
          # The entrypoint listens on :8891 once keys are present and config
          # files have been loaded — use a TCP probe.
          readinessProbe:
            tcpSocket:
              port: milter
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: milter
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "silver-opendkim.fullname" . }}-conf
        - name: keys
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "silver-opendkim.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: run
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
