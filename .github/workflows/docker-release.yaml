name: Publish container images

# Builds every image this repo owns and pushes it to GHCR on release, tagged
# with both `latest` and the release version.
#
# Release flow:
# git tag v0.2.0 && git push origin v0.2.0
# ...then publish a GitHub Release for that tag (or use workflow_dispatch).
#
# raven-sasl is deliberately absent: it is built in a different repository
# (ghcr.io/opengovmail/raven-sasl) and is only consumed here.

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 0.2.0)"
        required: true
        type: string

  # Build-only check on PRs that touch image sources. Never pushes.
  pull_request:
    paths:
      - "api-server/**"
      - "mail-infra/images/**"
      - ".github/workflows/docker-release.yaml"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pingmailer-api-server
            context: ./api-server
            dockerfile: ./api-server/Dockerfile
            platforms: linux/amd64,linux/arm64

          - name: pingmailer-dkim
            context: ./mail-infra/images/pingmailer-dkim
            dockerfile: ./mail-infra/images/pingmailer-dkim/Dockerfile
            platforms: linux/amd64,linux/arm64

          - name: pingmailer-smtp
            context: ./mail-infra/images/pingmailer-smtp-rootless
            dockerfile: ./mail-infra/images/pingmailer-smtp-rootless/Dockerfile
            platforms: linux/amd64,linux/arm64
            # The smtp-server chart defaults to `tag: rootless`.
            extra_tags: rootless

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          case "${{ github.event_name }}" in
            release)
              version="${GITHUB_REF_NAME#v}"
              ;;
            workflow_dispatch)
              version="${{ inputs.version }}"
              ;;
            *)
              version="pr-${{ github.event.number }}"
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $version"

      - name: Build tag list
        id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/$owner/${{ matrix.name }}"
          v="${{ steps.v.outputs.version }}"

          tags="${image}:${v}"

          # `latest` and extra tags only move on real releases.
          if [ "${{ github.event_name }}" = "release" ]; then
            tags="${tags},${image}:latest"

            for t in $(echo "${{ matrix.extra_tags }}" | tr ',' ' '); do
              [ -n "$t" ] && tags="${tags},${image}:${t}"
            done
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Tags: $tags"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### \`${{ matrix.name }}\` ${{ steps.v.outputs.version }}"
            echo
            echo "Platforms: \`${{ matrix.platforms }}\`"
            echo
            echo "Tags pushed:"
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
